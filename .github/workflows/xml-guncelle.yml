name: XML güncelle

on:
  schedule:
    - cron: "17 */3 * * *"   # 3 saatte bir
    # Rapor maili yalnızca bu çalışmada gider: 21:00 UTC = Türkiye 00:00
    # (GitHub zamanlanmış işleri bazen geç başlatır, mail birkaç dakika–saat gecikebilir)
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url || steps.yayin2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toptancı XML'ini dönüştür
        env:
          KAYNAK_URL: ${{ secrets.KAYNAK_URL }}
          CIKTI_KLASOR: yayin
          RAPOR_KLASOR: rapor
        run: python3 donustur.py
      - name: Aktarılmayan ürün raporunu mail at
        if: github.event.schedule == '0 21 * * *'
        continue-on-error: true   # mail sorunu XML yayınını durdurmasın
        env:
          MAIL_KULLANICI: ${{ secrets.MAIL_KULLANICI }}
          MAIL_SIFRE: ${{ secrets.MAIL_SIFRE }}
          MAIL_ALICI: ${{ secrets.MAIL_ALICI }}
        run: python3 rapor_mail.py rapor/atlanan-urunler.csv yayin/saveru-urunler.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: yayin
      - id: yayin
        uses: actions/deploy-pages@v4
        continue-on-error: true   # GitHub yüklenen dosyayı bazen birkaç saniye geç görüyor
      - name: Yayın ilk denemede olmadıysa bekle
        if: steps.yayin.outcome == 'failure'
        run: sleep 30
      - id: yayin2
        if: steps.yayin.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Ek kategori ve etiketleri Ticimax'e yaz (web servisi)
        env:
          TICIMAX_WS_KODU: ${{ secrets.TICIMAX_WS_KODU }}
        run: python3 ek_kategori.py yayin/saveru-urunler.xml --uygula --etiket-uygula
