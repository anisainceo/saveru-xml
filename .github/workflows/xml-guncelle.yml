name: XML güncelle

on:
  schedule:
    - cron: "17 */3 * * *"   # 3 saatte bir
    # Rapor maili yalnızca bu iki çalışmada gider (UTC; Türkiye 07:50 ve 19:50 — GitHub
    # zamanlanmış işleri genelde birkaç dakika geç başlattığı için mail ~08:00 / ~20:00 gelir)
    - cron: "50 4 * * *"
    - cron: "50 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toptancı XML'ini dönüştür
        env:
          KAYNAK_URL: ${{ secrets.KAYNAK_URL }}
          CIKTI_KLASOR: yayin
          RAPOR_KLASOR: rapor
        run: python3 donustur.py
      - name: Aktarılmayan ürün raporunu mail at
        if: github.event.schedule == '50 4 * * *' || github.event.schedule == '50 16 * * *'
        continue-on-error: true   # mail sorunu XML yayınını durdurmasın
        env:
          MAIL_KULLANICI: ${{ secrets.MAIL_KULLANICI }}
          MAIL_SIFRE: ${{ secrets.MAIL_SIFRE }}
          MAIL_ALICI: ${{ secrets.MAIL_ALICI }}
        run: python3 rapor_mail.py rapor/atlanan-urunler.csv yayin/saveru-urunler.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: yayin
      - id: yayin
        uses: actions/deploy-pages@v4
      - name: Ek kategori ve etiketleri Ticimax'e yaz (web servisi)
        env:
          TICIMAX_WS_KODU: ${{ secrets.TICIMAX_WS_KODU }}
        run: python3 ek_kategori.py yayin/saveru-urunler.xml --uygula --etiket-uygula
